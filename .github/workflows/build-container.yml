name: Build Docker Container

# La version de l'image est la premiere ligne du message de commit, et rien d'autre : le tag, le
# label OCI et la variable CAMEL_WORKER_VERSION viennent tous de cette valeur, pour que le module
# annonce toujours la version de l'image qui tourne.
#   v1.2                     -> snuids/camel4:v1.2
#   v1.2 Une phrase derriere -> snuids/camel4:v1.2
#   "juste une phrase"       -> echec, aucune image publiee
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION="$(printf '%s' "${{ github.event.head_commit.message }}" | head -n1 | tr -d '[:space:]')"
          if ! printf '%s' "$VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "Premiere ligne du message de commit = '$VERSION' ; une version (v1.2, 1.2, 1.2.3) est attendue." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION="${{ steps.version.outputs.version }}" \
            --build-arg REVISION="${GITHUB_SHA::7}" \
            -t "snuids/camel4:${{ steps.version.outputs.version }}" \
            -f Dockerfile .

      - name: Push to Docker Hub
        run: |
          echo "image : snuids/camel4:${{ steps.version.outputs.version }} (commit ${GITHUB_SHA::7})"
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push "snuids/camel4:${{ steps.version.outputs.version }}"
