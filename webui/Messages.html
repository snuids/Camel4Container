<!DOCTYPE html>
<html>
    <head>
        <title>APSB Messages</title>
        <script type="text/javascript" src="jquery-1.8.3.js"></script>
        <style type="text/css">
            * {
                margin: 0;
                padding: 0;
            }

            .topictitle
            {
                color:white;
                background-color:#333;               
                font-weight:bolder;
                font-size:18px;
                text-align:center;
                margin-bottom:5px;
                font-color:White;
                padding:3px;
            }

            .messageheader1
            {
                border:solid 2px #88F;
                font-weight:bolder;
                margin-bottom:5px;
                background-color: #448;
            }
            .messageheader2
            {
                border:solid 2px #FF0;
                font-weight:bolder;
                margin-bottom:5px;
                background-color:#880;
            }
            .messagebody
            {
                font-weight:bolder;
            }
        </style>
        <script type="text/javascript">
			var version = '1.1';
			var cursecond = 0;
			var curarray = [];
			var curtopics = [];
			var curtopicslist = [];
			var topicshash = new Object();
			var visibletopicshash = new Object();

			var GRAPHBORDERX = 5;

			var globalpointsx = [];
			var globalpointsy = [];
			var globalpointspointer = [];
			var totalmessages = 0;
			var topicstoshow = 0;
			var curmoreid = 0;
			var moremessages = [];

			const MessageBulletColorSrv1 = '#88F';
			const MessageBulletColorSrv2 = '#FF0';
			const MessageBulletBorderColor = '#000';
			const MessageBulletBorderWidth = 1;
			const MessageBulletRadius = 4;
			const MessageBulletBorderColorMatching = '#008';
			const MessageBulletBorderWidthMatching = 3;
			const MessageBulletRadiusMatching = 7;

			const GraphTriangularBarsGradientTop = '#F0F0FA';
			const GraphTriangularBarsGradientBottom = '#21305E';

			Array.prototype.unique = function() {
			   var a = this.concat();
			   for (var i = 0; i < a.length; ++i) {
				   for (var j = i + 1; j < a.length; ++j) {
					   if (a[i] === a[j])
						   a.splice(j, 1);
				   }
			   }

			   return a;
			};
			var configuration = null;
			$(document).ready(function() {
			   $('#longmessage').hide();
			   $('#messagescontainer').hide();
			   // Get the canvas & context

			   getFilter();

			   var c = $('#curvescanvas');
			   var ct = c.get(0).getContext('2d');
			   var container = $(c).parent();

			   $("#curvescanvas").click(function(eventObject) {
				   mouseX = eventObject.pageX - this.offsetLeft;
				   mouseY = eventObject.pageY - this.offsetTop;
				   curvesClick(mouseX, mouseY);
			   });

			   $(window).resize(respondCanvas);
			   
			   getUpdateToDo();

			   function respondCanvas() {
				   //console.log('hei:'+$(container).height()+" wid:"+$(container).width());

				   c.attr('width', $(container).width()); //max width
				   c.attr('height', $(container).height() - 50); //max height


				   //Redraw & reposition content
				   var x = c.width();
				   var y = c.height();
				   ct.font = "12px Arial";

				   paintCurves();
			   }

			   //Initial call
			   //DrawBulletLegend(ctx,x,y,color,radius,text)
			   DrawBulletLegend($('#legendcanvas')[0].getContext('2d'), 10, 10, MessageBulletColorSrv1, MessageBulletBorderColor, MessageBulletBorderWidth, MessageBulletRadius, 'Srv1');
			   DrawBulletLegend($('#legendcanvas')[0].getContext('2d'), 60, 10, MessageBulletColorSrv2, MessageBulletBorderColor, MessageBulletBorderWidth, MessageBulletRadius, 'Srv2');
			   DrawBulletLegend($('#legendcanvas')[0].getContext('2d'), 120, 10, MessageBulletColorSrv1, MessageBulletBorderColorMatching, MessageBulletBorderWidthMatching, MessageBulletRadiusMatching, '');
			   DrawBulletLegend($('#legendcanvas')[0].getContext('2d'), 140, 10, MessageBulletColorSrv2, MessageBulletBorderColorMatching, MessageBulletBorderWidthMatching, MessageBulletRadiusMatching, 'Matching search criteria');
			   respondCanvas();
			   getNewData();
			});

			function getUpdateToDo(){
				$.get("GETCONFIGURATION", function(data){
					configuration = JSON.parse(data);
					
					try {
						var nbToAdd = configuration.update.standartToAdd.length + configuration.update.singletonsToAdd.length + configuration.update.persistentToAdd.length;
						if (nbToAdd==0) {
							$("#btUpdate").hide();
						}
					} catch (e) {
					
					}
					
					try {
						var nbToDel = configuration.update.standartToDelete.length + configuration.update.singletonsToDelete.length + configuration.update.persistentToDelete.length;
						if (nbToDel==0) {
							$("#infoDelete").hide();
						}
					} catch (e) {
					
					}
			   });
			}
			function applyUpdate(){
				var topics = configuration.update.standartToAdd + "," + configuration.update.singletonsToAdd + "," + configuration.update.persistentToAdd
				topics = topics.replace(/,/g,"\r\n");
				msg = "The following topics will be added :\r\n" + topics;
				
				if (confirm(msg)){
					$.get("UPDATECONFIGURATION", function(data){
						getUpdateToDo();
				   });
				}
			}
			
			function infoDeletedTopics(){
				var topics =  configuration.update.standartToDelete + "," +configuration.update.singletonsToDelete + "," + configuration.update.persistentToDelete;
				
				topics = topics.replace(/,/g,"\r\n");
				alert("The following topics will be removed after an APSB restart :\r\n" + topics );
			}
			
			function showLongMessageText(id) {

			   var text = moremessages[id];
			   $('#longmessagecontent').html(text.replace(/<br\/>/g, "\r\n").replace(/<br><\/a>/g, "\r\n"));
			   $('#longmessage').show();
			   $('#longmessagecontent').focus().select();
			}

			function showLongMessage(i, j) {

			   //alert(text);    
			   var text = globalpointspointer[i].Messages[j].Message.replace(/\n/g, "<br/>").replace(/\r/g, "");
			   $('#longmessagecontent').html(text.replace(/<br\/>/g, "\r\n").replace(/<br><\/a>/g, "\r\n"));
			   $('#longmessage').show();
			   $('#longmessagecontent').focus().select();
			}

			function curvesClick(x, y) {
			   found = false;
			   //			$('#messages').hide();
			   //			console.log("XY:"+x+' '+y+' '+globalpointsx.length+" "+pointsx.length);
			   for (i = 0; i < globalpointsx.length; i++) {
				   if ((Math.abs(globalpointsx[i] - x) < 8) && (Math.abs(globalpointsy[i] - y) < 8)) {
					   //					console.log("GOTCHA"+globalpointspointer[i].Topic+' '+i+" XY="+globalpointsx[i]+" "+globalpointsy[i]);
					   str = "<div class='topictitle' >" + globalpointspointer[i].Topic + '</div>';

					   for (j = 0; j < globalpointspointer[i].Messages.length; j++) {
						   server1 = false;
						   server2 = false;

						   pubsubid = globalpointspointer[i].Messages[j].PubSubID;

						   pubsubid = pubsubid.substring(pubsubid.length - 1);

						   if (pubsubid == '1') {
							   server1 = true;
						   } else if (pubsubid == '2') {
							   server2 = true;
						   }
						   if (server2)
							   str += "<div class='messageheader2'>";
						   else
							   str += "<div class='messageheader1'>";
						   clientname = 'NA';
						   if (globalpointspointer[i].Messages[j].ClientName != undefined)
							   clientname = globalpointspointer[i].Messages[j].ClientName;

						   str += "Client:" + clientname + " ID:" + globalpointspointer[i].Messages[j].PubSubID + "</div>";
						   if (globalpointspointer[i].Messages[j].Message.length < 100)
							   str += "<span class='messagebody'>" + globalpointspointer[i].Messages[j].Message.replace(/\n/g, "<br/>") + "</span><br/>";
						   else {

							   str += "<span class='messagebody' title='" + globalpointspointer[i].Messages[j].Message + "' " + " style='z-index:100;cursor:pointer'>" + globalpointspointer[i].Messages[j].Message.replace(/\n/g, "<br/>").substring(0, 100) + "<span style='z-index:100;cursor=pointer;background-color:blue;'><a onclick='showLongMessageText(" + curmoreid + ")'><br/>(More)</a></span>" + "</span><br/>";
							   moremessages[curmoreid] = globalpointspointer[i].Messages[j].Message;
							   curmoreid++;
							   //alert(str);
						   }
						   if (j != globalpointspointer[i].Messages.length - 1)
							   str += "<br/>";
					   }
					   $('#messages').html(str);
					   $('#messagescontainer').fadeIn('fast', function() {});

					   found = true;
					   break;
				   }
			   }
			   if (!found) {
				   $('#longmessage').hide();
				   $('#messagescontainer').fadeOut('slow', function() {});
				   curmoreid = 0;
				   moremessages = [];

			   }
			}

			function getNewData() {
			   $.ajax({
				   type: 'GET',
				   url: 'http://localhost:8093/PUBSUBCMD?ID=' + cursecond,
				   success: function(data) {
					   handleNewData(data);
				   },
				   error: function() {
					   console.log('error, retrying');
					   setTimeout('getNewData()', 1000);
				   }
			   });
			}

			function handleNewData(data) {
			   full = eval('(' + data + ')');
			   newlist = full.Data;
			   totalmessages = full.TotalMessages;
			   topics = '';
		
			   if (newlist.length > 0) {
				   cursecond = newlist[newlist.length - 1].CurrentSecond;
				   curarray = curarray.concat(newlist);


				   if (curarray.length > 300) {
					   curarray.splice(0, 1);
				   }

				   for (i = 0; i < newlist.length; i++) {
					   for (j = 0; j < newlist[i].Topics.length; j++) {
						   curtopic = newlist[i].Topics[j].Topic;

						   if (!curtopics.hasOwnProperty(curtopic)) {
							   curtopics[curtopic] = curtopic;
						   }
						   topics += newlist[i].Topics[j].Topic;

					   }
				   }
			   } else {
				   cursecond = full.CurrentSecond - 1;
			   }

			   curtopicslist = [];

			   topicshash = new Object();
			   var t = 0;
			   for (var k in curtopics) {
				   if (!topicshash.hasOwnProperty(k)) {
					   topicshash[k] = 1;
				   }

				   if (curtopics.hasOwnProperty(k)) {
					   curtopicslist[t] = k;
					   t++;
				   }
			   }

			   prepareNumberOfCurves();

			   curtopicslist.sort();
			   $('#topics').text(version + " (" + totalmessages + ")");

			   setTimeout('getNewData()', 1000);

			   paintCurves();
			}

			function prepareNumberOfCurves() {

			   var count = 0;
			   split = $('#topicfilter').val().split(' ');
			   visibletopicshash = new Object();
			   for (i = 0; i < split.length; i++) {
				   for (var k in topicshash) {
					   if ((split[i] != '') && (k.indexOf(split[i]) >= 0)) {
						   if (visibletopicshash[k] != 1) {
							   visibletopicshash[k] = 1;
							   count++;
						   }

					   }
				   }
			   }


			   topicstoshow = count;
			   if (topicstoshow == 0)
				   topicstoshow = curtopicslist.length;


			   console.log("Topics to show:" + topicstoshow);
			   return curtopicslist.length;
			}

			function paintCurves() {
			   var ctx = $('#curvescanvas')[0].getContext("2d");

			   var W = $('#curvescanvas').width();
			   var H = $('#curvescanvas').height();

			   fillRect(ctx, 0, 0, W, H, '#FFF');

			   if (curtopicslist.length == 0)
				   return;

			   hpergraph = H / topicstoshow;

			   globalcurpoint = 0;
			   globalpointsx = [];
			   globalpointsy = [];
			   globalpointspointer = [];

			   var cury = 0;

			   // paint one curve
			   for (y = 0; y < curtopicslist.length; y++) {
				   if ((topicstoshow != curtopicslist.length) && (!visibletopicshash.hasOwnProperty(curtopicslist[y]))) {
					   continue;
				   }

				   starty = cury * hpergraph;
				   cury++;

				   var lingrad = ctx.createLinearGradient(0, starty, 0, starty + hpergraph);
				   lingrad.addColorStop(0, '#fff');
				   lingrad.addColorStop(0.5, '#ccc');
				   lingrad.addColorStop(1, '#fff');

				   fillRect(ctx, 5, starty + 5, W - (GRAPHBORDERX * 2), hpergraph - 10, lingrad /*'#EEE'*/ );
				   paintRect(ctx, 5, starty + 5, W - (GRAPHBORDERX * 2), hpergraph - 10, '#000');

				   for (u = (cursecond % 10) * 5; u < W - (GRAPHBORDERX * 2); u += 50) {
					   ctx.beginPath();
					   ctx.moveTo(5 + u, starty + 5);
					   ctx.lineTo(5 + u, starty + 5 + hpergraph - 10);
					   ctx.strokeStyle = '#aaa';
					   ctx.closePath();
					   ctx.stroke();
				   }
				   ctx.beginPath();
				   ctx.moveTo(5, starty + 5 + (hpergraph - 10) / 2);
				   ctx.lineTo(W - 10, starty + 5 + (hpergraph - 10) / 2);
				   ctx.strokeStyle = '#aaa';
				   ctx.closePath();
				   ctx.stroke();

				   // find max

				   max = 0;


				   for (i = 0; i < curarray.length; i++) {
					   for (j = 0; j < curarray[i].Topics.length; j++) {
						   if (curarray[i].Topics[j].Topic == curtopicslist[y]) {
							   if (curarray[i].Topics[j].Count > max)
								   max = curarray[i].Topics[j].Count;

						   }
					   }
				   }

				   pointsx = [];
				   pointsy = [];
				   pointspointer = [];
				   curpoint = 0;

				   ctx.beginPath();
				   ctx.moveTo(GRAPHBORDERX, hpergraph + starty - 5);
				   ctx.stroke();
				   prevx = GRAPHBORDERX;
				   sectodraw = cursecond;

				   for (i = curarray.length - 1; i >= 0; i--, sectodraw - 1) {
					   found = false;
					   for (j = 0; j < curarray[i].Topics.length; j++) {
						   if (curarray[i].Topics[j].Topic == curtopicslist[y]) {
							   if ((sectodraw - 1) != curarray[i].CurrentSecond) {
								   limit = 1000;
								   while ((sectodraw) != curarray[i].CurrentSecond) {
									   curxx = secondToX(sectodraw, W) + 5;
									   if ((sectodraw - 1) != curarray[i].CurrentSecond)
										   ctx.lineTo(curxx, hpergraph + starty - 5);

									   if (curxx > W - (2 * GRAPHBORDERX))
										   break;


									   sectodraw--;
									   //									
									   limit--;
									   if (limit == 0)
										   break;
								   }
							   } 
							   sectodraw = curarray[i].CurrentSecond;
							   found = true;
							   curx = secondToX(curarray[i].CurrentSecond, W);
							   if (curx > W - (2 * GRAPHBORDERX))
								   break;
							   gy = (curarray[i].Topics[j].Count / max) * (hpergraph - 10);


							   pointsx[curpoint] = curx;
							   pointsy[curpoint] = starty - 5 + (hpergraph - gy);
							   pointspointer[curpoint] = curarray[i].Topics[j];

							   globalpointsx[globalcurpoint] = curx;
							   globalpointsy[globalcurpoint] = starty - 5 + (hpergraph - gy);
							   globalpointspointer[globalcurpoint] = curarray[i].Topics[j];

							   prevx = curx;

							   ctx.lineTo(pointsx[curpoint], pointsy[curpoint]);

							   globalcurpoint++;
							   curpoint++;
						   }
					   }
				   }

				   ctx.lineTo(pointsx[curpoint - 1] + 5, hpergraph + starty - 5);
				   ctx.lineTo(W - (2 * GRAPHBORDERX), hpergraph + starty - 5);
				   ctx.closePath();
				   ctx.fillStyle = '#00F';
				   ctx.strokeStyle = '#888';

				   var mygradient = ctx.createLinearGradient(0, starty + 5, 0, starty + hpergraph - 10);
				   mygradient.addColorStop(0, GraphTriangularBarsGradientTop);
				   mygradient.addColorStop(1, GraphTriangularBarsGradientBottom);
				   ctx.fillStyle = mygradient;

				   ctx.fill();
				   ctx.stroke();


				   i = 0;

				   search = $('#topicsearch').val();

				   for (i = 0; i < curpoint; i++) {
					   if (search == '') {

						   foundmatch = false;
					   } else {
						   foundmatch = false;

						   for (z = 0; z < pointspointer[i].Messages.length; z++) {
							   if (pointspointer[i].Messages[z].Message.match(search)) {
								   foundmatch = true;
							   }
						   }
					   }
					   server1 = false;
					   server2 = false;
					   for (z = 0; z < pointspointer[i].Messages.length; z++) {

						   pubsubid = pointspointer[i].Messages[z].PubSubID;

						   pubsubid = pubsubid.substring(pubsubid.length - 1);

						   if (pubsubid == '1') {
							   server1 = true;
						   } else if (pubsubid == '2') {
							   server2 = true;
						   }
						   //console.log(">"+pointspointer[i].Topic+"<"+pubsubid+":"+pointspointer[i].Messages[z].PubSubID+">"+server1+"="+server2+"<");
					   }

					   ctx.beginPath();
					   drawhalf = false;

					   if (foundmatch) {
						   ctx.strokeStyle = MessageBulletBorderColorMatching;
						   ctx.lineWidth = MessageBulletBorderWidthMatching;
						   radius = MessageBulletRadiusMatching;
					   } else {
						   ctx.strokeStyle = MessageBulletBorderColor;
						   ctx.lineWidth = MessageBulletBorderWidth;
						   radius = MessageBulletRadius;
					   }

					   if ((server2 == true) && (server1 == false)) {
						   ctx.arc(pointsx[i], pointsy[i], radius, 0, Math.PI * 2, true);
						   ctx.fillStyle = MessageBulletColorSrv2;
					   } else if ((server2 == false) && (server1 == true)) {
						   ctx.arc(pointsx[i], pointsy[i], radius, 0, Math.PI * 2, true);
						   ctx.fillStyle = MessageBulletColorSrv1;
					   } else {
						   ctx.arc(pointsx[i], pointsy[i], radius, 0, Math.PI * 2, true);
						   ctx.fillStyle = MessageBulletColorSrv2;
						   drawhalf = true;
					   }
					   //ctx.strokeStyle='#000';
					   ctx.closePath();
					   ctx.fill();
					   ctx.stroke();
					   if (drawhalf) {
						   ctx.beginPath();
						   ctx.arc(pointsx[i], pointsy[i], radius, Math.PI / 2, Math.PI * 3 / 2, true);


						   ctx.fillStyle = MessageBulletColorSrv1
							   //ctx.strokeStyle='#000';
						   ctx.closePath();
						   ctx.fill();
						   ctx.stroke();
					   }
					   ctx.lineWidth = 1; // Reset to default value

				   }

				   ctx.textAlign = "center";
				   ctx.fillStyle = "#000"; //white
				   ctx.fillText(max, 15, starty + 20);

				   ctx.textAlign = "center";
				   ctx.fillStyle = "#000"; //white
				   ctx.fillText(curtopicslist[y], (W / 2), starty + 20);

			   }
			}

			function secondToX(curs, width) {
			   if (curarray.length < 2) {
				   return 0;
			   }

			   startsec = curarray[0].CurrentSecond;
			   return GRAPHBORDERX + ((cursecond - curs) * 5);
			}

			function fillRect(ctx, x, y, w, h, color) {
			   ctx.beginPath();
			   ctx.rect(x, y, w, h);
			   ctx.closePath();
			   ctx.fillStyle = color;
			   ctx.fill();
			}

			function paintRect(ctx, x, y, w, h, color) {
			   ctx.beginPath();
			   ctx.rect(x, y, w, h);
			   ctx.closePath();
			   ctx.strokeStyle = color;
			   ctx.stroke();
			}

			function saveFilter() {
			   if (typeof(Storage) !== "undefined") {
				   var fil = $('#topicfilter').val();
				   var search = $('#topicsearch').val();

				   localStorage.setItem("topicfilter", fil);
				   localStorage.setItem("topicsearch", search);
			   }
			};

			function getFilter() {
			   if (typeof(Storage) !== "undefined") {
				   if (localStorage.topicfilter != null) {
					   $('#topicfilter').val(localStorage.topicfilter);
				   }

				   if (localStorage.topicsearch != null) {
					   $('#topicsearch').val(localStorage.topicsearch);
				   }
			   }
			}

			function DrawBulletLegend(ctx, x, y, fillcolor, bordercolor, borderwidth, radius, text) {
			   ctx.beginPath();
			   ctx.arc(x, y, radius, 0, Math.PI * 2, true);

			   ctx.fillStyle = fillcolor;

			   ctx.strokeStyle = bordercolor;
			   ctx.lineWidth = borderwidth;
			   ctx.closePath();
			   ctx.fill();

			   ctx.stroke();

			   ctx.textAlign = "left";
			   ctx.fillStyle = 'black';
			   ctx.fillText(text, x + radius + 5, y + radius / 2);
			}
		
        </script>
    </head>
    <body> 
        <h1>APSB Supervisor</h1>
        <div id="topics" style='position:absolute;top:10px;right:10px;font-size:10px;'>
        </div>
        
        <div style="position:absolute;top:5px;left:300px;font-size:14px;z-index:100;"><span style="width:60px;float:left;">Filter:</span><input id='topicfilter' onkeyup="saveFilter();" type="text" name="Topics" style="width:300px" >            
        </div>
        
        <div style="position:absolute;top:28px;left:300px;font-size:14px;z-index:100;">
            <span style="width:60px;float:left;">Search:</span><input id='topicsearch' onkeyup="saveFilter();" type="text" name="Topics" style="width:300px" >
        </div>

        <div id="legend" style="position:absolute;top:25px;right:10px;font-size:14px;z-index:50;">
            <canvas id="legendcanvas" width="260px" height="25px" ></canvas>
        </div>
		<div id="btUpdate" style="position:absolute;top:25px;right:280px;font-size:14px;z-index:50;">
            <a href="#" onclick="applyUpdate()" style="padding:5px;padding-right:10px;padding-left:10px;background-color:red;color:white;font-size:1em;font-weight:bold;text-decoration:none;border-radius:3px;">Apply update</a>
        </div>
		<div id="infoDelete" style="position:absolute;top:25px;right:390px;font-size:14px;z-index:50;">
            <a href="#" onclick="infoDeletedTopics()" style="padding:5px;padding-right:10px;padding-left:10px;background-color:red;color:white;font-size:1em;font-weight:bold;text-decoration:none;border-radius:3px;">Deleted topics</a>
        </div>
	
        <div id="longmessage" style='position:absolute;top:50px;right:50px;left:50px;bottom:50px;font-size:10px;background-color:White;border:1px solid #000;z-index:50;'>
            <div id="longmessage2" style='position:absolute;top:10px;right:10px;left:10px;bottom:40px;font-size:10px;background-color:White;border:0px solid #000;overflow:auto;font-size:14px;'>
                <textarea id="longmessagecontent" style="width:98%;height:98%">
                </textarea>
                <!--div id="longmessagecontent" ></div-->
            </div>
            <div style='position:absolute;width:100%;bottom:10px;text-align:center;z-index:100;'><input type="button" onclick="$('#longmessage').hide();" value="Close" /></div>
        </div>


        <div id="records">
        </div>
        <div id="temp">
        </div>	
        <div id="messagescontainer" style="font-size:13px;position:absolute;width:40%;right:10px;top:50px;bottom:10px;overflow-x:hidden;overflow-y:auto;z-index:10;">
            <div id="messages" style="font-size:13px;position:absolute;z-index:10;top:3px;right:3px;left:3px;border:solid 0px #000;color:#fff;padding:0px;opacity: 0.8;background-color:#000;">		        
            </div>
