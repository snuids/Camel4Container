        <script type="text/javascript">
            var selectedid='';
            var full='';
            var selectedroute='';
            var lastrouteupdated;
            var lastrouteupdatetime;
            var lastdata='';
            
            $(function() {
                $( "input[type=submit], a, button" )
                  .button()
                  .click(function( event ) {
                    event.preventDefault();
                  });
              });
            
            $(document).ready(function () 
            {   
                
                $( "#dialog-modal" ).dialog({ 
                                    autoOpen: false,
                                    title:'Edit route',
                                    
                                    width:400,
                                    height: 140,
                                    resizable:false,
                                    modal: true});//.hide();
                getNewData();
                
            });

            function jmxChanged() {
                selectedid = $("#clientscombo").val();
            }

            function modifyRoute(command)
            {
                $.ajax({
                    type: 'GET',
                    url: '/COMMANDROUTE?',
                    data:"command="+command+"&r="+Math.random()+"&client=" + selectedid + "&route=" + selectedroute,
                    success:function(data)
                    {                        
                        lastrouteupdated=selectedroute;
                        lastrouteupdatetime=new Date(new Date().getTime()+5000);
                        handleNewData(lastdata);
                        $( "#dialog-modal" ).dialog("close");
                    },
                    error:function()
                    {
                        alert('error');
                    }
                });
            }
            
            
            
            function showDialogControl(id)
            {          
                $.each(full.clients, function(i, item) 
                {            
                    
                    if(selectedid==item.id)
                    {
                        $.each(item.data.Routes, function(i, item2) 
                        {
                            if(item2.id==id)
                            {
                                selectedroute=id;

                                if(item2.state=="Started")
                                {
                                    $( "#resumebutton" ).hide();
                                    $( "#suspendbutton" ).show();
                                }
                                else
                                {
                                    $( "#resumebutton" ).show();
                                    $( "#suspendbutton" ).hide();

                                }
                                //$( "#dialog-modal" ).dialog("open");
                                $( "#dialog-modal" ).dialog({
                                    title:'Route:'+id,
                                    width:400,
                                    height: 140,
                                    resizable:false,
                                    modal: true
                                });
                                $( "#dialog-modal" ).dialog("open");
                                return;
                            }
                        });
                    }
                });
                
                
            }
            
            function getNewData()
            {
                //			console.log("'/PUBSUBCMD?ID='"+cursecond);
                $.ajax({
                    type: 'GET',
                    url: '/SHOWROUTE?R='+Math.random(),			  
                    success:function(data)
                    {
                        //console.log(data);
                        //alert('success'+data);
                        lastdata=data;
                        handleNewData(data);
                        setTimeout("getNewData()", 2000);
                    },
                    error:function()
                    {
                        alert('error');
                    }
                });			
            }
            
            function handleNewData(data)
            {
                var options = $("#clientscombo");
                full=eval('('+data+')');
                                           
                if(selectedid=='')
                {
                    $.each(full.clients, function(i, item) 
                    {            
                        if((i==0)&&(selectedid==''))
                            selectedid=item.id;
                        options.append($("<option />").val(item.id).text(item.id));
                    });
                }
                
                var table="<table width='100%' class='table'>";
                $.each(full.clients, function(i, item) 
                {      
                    if(selectedid==item.id)
                    {
                        table+="<tr>";
                            table+="<th>ID";
                            table+="</th>";
                            table+="<th>State";
                            table+="</th>";
                            table+="<th>Ok";
                            table+="</th>";
                            table+="<th>Ko";
                            table+="</th>";
                            table+="<th>Total";
                            table+="</th>";
                            table+="<th>Proc Time";
                            table+="</th>";
                            table+="<th>Last Time";
                            table+="</th>";
                            table+="<th>Total Time";
                            table+="</th>";
                            table+="<th>First Exchange";
                            table+="</th>";
                            table+="<th>Last Exchange";
                            table+="</th>";
                        table+="</tr>";
                        
                        $.each(item.data.Routes, function(i, item2) 
                        {
                            table+="<tr onclick=\"showDialogControl('"+item2.id+"');\">";
                                table+="<td>";
                                table+="<span title='"+item2.id+"'>"+item2.id+"</span>";                                
                                table+="</td>";
                                if((lastrouteupdated==item2.id)&&
                                (lastrouteupdatetime>new Date()))
                                {
                                    table+="<td><span class='routestate_Updating'>";
                                    table+="Updating";                                
                                    table+="</span></td>";
                                }
                                else
                                {
                                    table+="<td><span class='routestate_"+item2.state+"'>";
                                    table+=item2.state;                                
                                    table+="</span></td>";
                                }
                                table+="<td>";
                                table+=item2.exchangesCompleted;                                
                                table+="</td>";
                                table += "<td>";
                                if(item2.exchangesFailed==0)
                                    table += item2.exchangesFailed;
                                else
                                    table += "<span style='color:red;font-weight:bolder;'>" + item2.exchangesFailed + "</span>";                                
                                table+="</td>";
                                table+="<td>";
                                table+=item2.totalExchanges;                                
                                table+="</td>";
                                table+="<td>";
                                table+=item2.minProcessingTime+"/"+item2.meanProcessingTime+"/"+item2.maxProcessingTime+" ms";                                
                                table+="</td>";
                                table+="<td>";
                                table+=item2.lastProcessingTime+" ms";                                
                                table+="</td>";
                                table+="<td>";
                                table+=item2.totalProcessingTime+" s";                                
                                table+="</td>";
                                table+="<td>";
                                if(item2.firstExchangeCompletedTimestamp!=undefined)
                                    table+=item2.firstExchangeCompletedTimestamp;                                
                                table+="</td>";
                                table+="<td>";
                                if(item2.lastExchangeCompletedTimestamp!=undefined)
                                    table+=item2.lastExchangeCompletedTimestamp;                                
                                table+="</td>";
                            table+="</tr>";
                        });
                        table += "</table>";    
                    }
                    
                });
                //alert(table);
                $('#routetable').html(table);

    <body>
        <h1>&nbsp;APSB Routes</h1>
        
        <div style="position:absolute;right:10px;top:10px">Client:&nbsp;<select id="clientscombo" onchange='jmxChanged();'></select></div>
        
        
        <div id="routetable" class="display" style="position:absolute;left:10px;right:10px;top:40px;bottom:20px;">
        </div>
        
        
        <div id="dialog-modal" title="Basic modal dialog">
            <p>Choose one of the following operation.</p>
            <div style="position:absolute;bottom:10px;right:10px;;text-align: right;">
            
            <button onclick="modifyRoute('reset');">Reset Stats</button>
            <button onclick="modifyRoute('resume');" id="resumebutton">Resume</button>
            <button onclick="modifyRoute('suspend');" id="suspendbutton">Suspend</button>
            
            </div>
        </div>
