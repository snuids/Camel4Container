                width: 520px;

            #dialog_window_minimized_container {
                position: fixed;
                bottom: 0px;
                left: 0px;
            }

            .dialog_window_minimized {
                float: left;
                padding: 5px 10px;
                font-size: 12px;
                cursor: pointer;
                margin-right: 2px;
                display: none;
            }

            .dialog_window_minimized .ui-icon {
                display: inline-block !important;
                position: relative;
                top: 3px;
                cursor: pointer;
            }

            .ui-dialog .ui-dialog-titlebar-minimize {
                height: 18px;
                width: 19px;
                padding: 1px;
                position: absolute;
                right: 23px;
                top: 9px;
            }

            .ui-dialog .ui-dialog-titlebar-minimize .ui-icon {
                display: block;
                margin: 1px;
            }

            .ui-dialog .ui-dialog-titlebar-minimize:hover, .ui-dialog .ui-dialog-titlebar-minimize:focus {
                padding: 0;
            }

        <!--link rel="stylesheet" type="text/css" href="tablestyle.css"--> 

        <script type="text/javascript">
            var _init = $.ui.dialog.prototype._init;
            $.ui.dialog.prototype._init = function() {
                _init.apply(this, arguments);
			
                var dialog_element = this;
                var dialog_id = this.uiDialogTitlebar.next().attr('id');
			
                this.uiDialogTitlebar.append('<a href="#" id="' + dialog_id + 
                    '-minbutton" class="ui-dialog-titlebar-minimize ui-corner-all">'+
                    '<span class="ui-icon ui-icon-minusthick"></span></a>');
			
                $('#dialog_window_minimized_container').append(
                '<div class="dialog_window_minimized ui-widget ui-state-default ui-corner-all" id="' + 
                    dialog_id + '_minimized">' + this.uiDialogTitlebar.find('.ui-dialog-title').text() + 
                    '<span class="ui-icon ui-icon-newwin"></div>');
				
                $('#' + dialog_id + '-minbutton').hover(function() {
                    $(this).addClass('ui-state-hover');
                }, function() {
                    $(this).removeClass('ui-state-hover');
                }).click(function() {
                    dialog_element.close();
                    $('#' + dialog_id + '_minimized').show();
                });
			
                $('#' + dialog_id + '_minimized').click(function() {
                    $(this).hide();
                    dialog_element.open();
                });
            };

            $(document).ready(function() 
            {
                

                $('#create_newwindow_button').button().click(function() {
					
                    var div_count = $('.dialog_window').length + 1;
                    var div_id = 'dialog_window_' + div_count;
                    var div_title = "SQL Prompt ("+(div_count)+")";
                    var div_content = "";
                    var sqlarea_id = 'sql_' + div_count;
                    var sqlresult_id = 'sqlres_' + div_count;
                    div_content="<div class='sqlheader'><textarea id='"+sqlarea_id+"' rows='4' cols='50' width='100%'>select * from inductions</textarea></div>";
                    

                    div_content+="<div id='"+sqlresult_id+"' class='sqlresultcontent'></div>"
//                    alert(sqlresult_id);
                    var buttons = new Array();
                    buttons.push({
                        text: 'COMPUTE',
                        click: function() {
                           //alert('ALERTING from Dialog Window: ' + div_count+
                           //"=>"+$('#sql_'+div_count).val());
                           sendSql(div_count,$('#sql_'+div_count).val());
                        }
                     });

                    $('body').append('<div class="dialog_window" id="' + div_id + '">' + div_content + '</div>');

                    var dialog = $('#' + div_id).dialog({
                        width: 600,
                        height: 400,
                        title : div_title,
                        autoOpen : true,
                        buttons: buttons
                    });
					
                });
                
				
                
                $('#buttonlist').buttonset();
            });

        </script>
