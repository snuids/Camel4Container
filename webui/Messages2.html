<!DOCTYPE html>
<html>
    <head>
        <title>APSB Messages</title>
        <script type="text/javascript" src="jquery-1.8.3.js"></script>
        <style type="text/css">
            * {
                margin: 0;
                padding: 0;
            }


            .topictitle
            {
                color:white;
                background-color:#333;               
                font-weight:bolder;
                font-size:18px;
                text-align:center;
                margin-bottom:5px;
                font-color:White;
                padding:3px;
            }

            .messageheader1
            {
                border:solid 2px #0C0;
                font-weight:bolder;
                margin-bottom:5px;
                background-color: #080;
            }
            .messageheader2
            {
                border:solid 2px #C00;
                font-weight:bolder;
                margin-bottom:5px;
                background-color:#800;
            }
            .messagebody
            {
                font-weight:bolder;
            }
        </style>
        <script type="text/javascript">
            var cursecond=0;
            var curarray=[];
            var curtopics=[];
            var curtopicslist=[];
            var GRAPHBORDERX=5;
		
            var globalpointsx=[];
            var globalpointsy=[];
            var globalpointspointer=[];
            var totalmessages=0;		
		
            Array.prototype.unique = function() 
            {
                var a = this.concat();
                for(var i=0; i<a.length; ++i) 
                {
                    for(var j=i+1; j<a.length; ++j) 
                    {
                        if(a[i] === a[j])
                            a.splice(j, 1);
                    }
                }

                return a;
            };

            $(document).ready(function () 
            {
                $('#longmessage').hide();
                $('#messagescontainer').hide();
                //Get the canvas & context
			
                var c = $('#curvescanvas');
                var ct = c.get(0).getContext('2d');
                var container = $(c).parent();

                $("#curvescanvas").click(function(eventObject) {
                    mouseX = eventObject.pageX - this.offsetLeft;
                    mouseY = eventObject.pageY - this.offsetTop;
                    curvesClick(mouseX,mouseY);
                });

                $(window).resize( respondCanvas );

                function respondCanvas()
                {
                    //console.log('hei:'+$(container).height()+" wid:"+$(container).width());

                    c.attr('width', $(container).width() ); //max width
                    c.attr('height', $(container).height() -50); //max height


                    //Redraw & reposition content
                    var x = c.width();
                    var y = c.height();  			
                    ct.font = "12px Arial";
											
                    paintCurves();
                }

                //Initial call
                respondCanvas();			
                getNewData();
            });

            function showLongMessage(text) {
	    
                $('#longmessagecontent').html ( text);
                $('#longmessage').show();       
            }

            function curvesClick(x,y)
            {
                found=false;
                //			$('#messages').hide();
                //			console.log("XY:"+x+' '+y+' '+globalpointsx.length+" "+pointsx.length);
                for(i=0;i<globalpointsx.length;i++)
                {
                    if((Math.abs(globalpointsx[i]-x)<8)
                        &&(Math.abs(globalpointsy[i]-y)<8))
                    {
                        //					console.log("GOTCHA"+globalpointspointer[i].Topic+' '+i+" XY="+globalpointsx[i]+" "+globalpointsy[i]);
                        str="<div class='topictitle' >"+globalpointspointer[i].Topic+'</div>';

                        for(j=0;j<globalpointspointer[i].Messages.length;j++)
                        {
                            server1 = false;
                            server2 = false;                        
                    
                            pubsubid = globalpointspointer[i].Messages[j].PubSubID;
                    
                            pubsubid=pubsubid.substring(pubsubid.length - 1);
                    
                            if (pubsubid == '1') {
                                server1 = true;
                            } else if (pubsubid == '2') 
                            {
                                server2 = true;
                            }
                            if(server2)
                                str += "<div class='messageheader2'>";
                            else
                                str += "<div class='messageheader1'>";
                            clientname = 'NA';
                            if (globalpointspointer[i].Messages[j].ClientName != undefined)
                                clientname = globalpointspointer[i].Messages[j].ClientName;

                            str += "Client:" + clientname + " ID:" + globalpointspointer[i].Messages[j].PubSubID + "</div>";
                            if (globalpointspointer[i].Messages[j].Message.length < 100)
                                str += "<span class='messagebody'>" + globalpointspointer[i].Messages[j].Message.replace(/\n/g, "<br/>") + "</span><br/>";
                            else {
                                str += "<span class='messagebody' title='" + globalpointspointer[i].Messages[j].Message
                                    + "' "
                                    + " style='z-index:100;'>" + globalpointspointer[i].Messages[j].Message.replace(/\n/g, "<br/>").substring(0, 100)
                                    + "<span style='z-index:100;cursor=pointer;background-color:blue;'><a onclick='showLongMessage(\"" + globalpointspointer[i].Messages[j].Message.replace(/\n/g, "<br/>").replace(/\r/g, "") + "\")'><br/>(More)</a></span>" 
                                    + "</span><br/>";
                            }
                            if(j!=globalpointspointer[i].Messages.length-1)
                                str+="<br/>";
                        }
                        $('#messages').html(str);
                        $('#messagescontainer').fadeIn('fast', function() {});
					
                        found=true;
                        break;
                    }
                }
                if(!found) {
                    $('#longmessage').hide();
                    $('#messagescontainer').fadeOut('slow', function() {});
				
                }
            }
		
            function getNewData()
            {
                //			console.log("'/PUBSUBCMD?ID='"+cursecond);
                $.ajax({
                    type: 'GET',
                    url: '/PUBSUBCMD?ID='+cursecond,			  
                    success:function(data)
                    {
                        //console.log(data);
                        //alert('success'+data);
                        handleNewData(data);
                    },
                    error:function()
                    {
                        console.log('error');
                    }
                });			
            }
		
            function handleNewData(data)
            {
                //			$('#temp').text(data);
                full=eval('('+data+')');
                //			alert(full.CurrentSecond);
                newlist=full.Data;
                totalmessages=full.TotalMessages;
                topics='';
                //			console.log("pain=>"+newlist.length);			
                if(newlist.length>0)
                {
                    cursecond=newlist[newlist.length-1].CurrentSecond;
                    curarray=curarray.concat(newlist);
                    //				console.log("new list size:"+newlist.length);
                    //				console.log("currarray size:"+curarray.length);

                    if(curarray.length>300)
                    {
                        curarray.splice(0,1);
                        //console.log("Size:"+curarray.length);
                    }
				
                    for(i=0;i<newlist.length;i++)
                    {
                        for(j=0;j<newlist[i].Topics.length;j++)
                        {
                            //						for(k=0;k<newlist[i].Topics[j].Messages)
                            curtopic=newlist[i].Topics[j].Topic;
						

                            /*						for (var k in curtopics) 
                                        {
                                            if (curtopics.hasOwnProperty(k)) 
                                                        {
                                                console.log('key is: ' + k + ', value is: ' + curtopics[k]);
                                            }
                                        }*/
						
                            if(!curtopics.hasOwnProperty(curtopic))
                            {
                                //							console.log("Add "+curtopic);
                                curtopics[curtopic]=curtopic;
                            }
                            topics+=newlist[i].Topics[j].Topic;
						
                        }
                    }
                }
                else
                    cursecond=full.CurrentSecond-1;
                //console.log(curtopics);
					
					
						
                curtopicslist=[];
                var t=0;
                for (var k in curtopics) 
                {
                    if (curtopics.hasOwnProperty(k)) 
                    {
                        //					console.log('key is: ' + k + ', value is: ' + consoleurtopics[k]);
                        curtopicslist[t]=k;
                        t++;
                    }
                }
						
                curtopicslist.sort();
                $('#topics').text(curtopicslist+" ("+totalmessages+")");
                //		  $('#records').text(curarray.length+' '+cursecond);
                setTimeout('getNewData()',1000);
			
                paintCurves();
            }
		
            function paintCurves()
            {
                var ctx = $('#curvescanvas')[0].getContext("2d");
						
			
                var W = $('#curvescanvas').width();
                var H = $('#curvescanvas').height();  			

                fillRect(ctx,0,0,W,H,'#FFF');

			
			
                if(curtopicslist.length==0)
                    return;
			
                hpergraph=H/curtopicslist.length;
                //console.log(hpergraph+" "+curtopicslist.length);
			
                globalcurpoint=0;
                globalpointsx=[];
                globalpointsy=[];
                globalpointspointer=[];
			
                // paint one curve
                for(y=0;y<curtopicslist.length;y++)
                {
				
                    starty=y*hpergraph;
				
                    var lingrad = ctx.createLinearGradient(0,starty,0,starty+hpergraph);
                    lingrad.addColorStop(0, '#fff');
                    lingrad.addColorStop(0.5, '#ccc');
                    lingrad.addColorStop(1, '#fff');
				
                    fillRect(ctx,5,starty+5,W-(GRAPHBORDERX*2),hpergraph-10,lingrad/*'#EEE'*/);
                    paintRect(ctx,5,starty+5,W-(GRAPHBORDERX*2),hpergraph-10,'#000');
				
                    for(u=(cursecond%10)*5;u<W-(GRAPHBORDERX*2);u+=50)
                    {
                        ctx.beginPath();
                        ctx.moveTo(5+u,starty+5);
                        ctx.lineTo(5+u,starty+5+hpergraph-10);
                        ctx.strokeStyle='#aaa';
                        ctx.closePath();
                        ctx.stroke();
                    }
                    ctx.beginPath();
                    ctx.moveTo(5,starty+5+(hpergraph-10)/2);
                    ctx.lineTo(W-10,starty+5+(hpergraph-10)/2);
                    ctx.strokeStyle='#aaa';
                    ctx.closePath();
                    ctx.stroke();
				
                    // find max
				
                    max=0;
				
				
                    for(i=0;i<curarray.length;i++)
                    {
                        for(j=0;j<curarray[i].Topics.length;j++)
                        {
                            if(curarray[i].Topics[j].Topic==curtopicslist[y])
                            {
                                if(curarray[i].Topics[j].Count>max)
                                    max=curarray[i].Topics[j].Count;

                            }
                        }
                    }

                    pointsx=[];
                    pointsy=[];
                    pointspointer=[];
                    curpoint=0;
				
                    ctx.beginPath();
                    ctx.moveTo(GRAPHBORDERX,hpergraph+starty-5);
                    ctx.stroke();
                    prevx=GRAPHBORDERX;
                    sectodraw=cursecond;
				
                    for(i=curarray.length-1;i>=0;i--,sectodraw-1)
                    {
                        found=false;
                        for(j=0;j<curarray[i].Topics.length;j++)
                        {						
                            if(curarray[i].Topics[j].Topic==curtopicslist[y])
                            {
                                if((sectodraw-1)!=curarray[i].CurrentSecond)
                                {
                                    limit=1000;
                                    while((sectodraw)!=curarray[i].CurrentSecond)
                                    {
                                        curxx=secondToX(sectodraw,W)+5;
                                        if((sectodraw-1)!=curarray[i].CurrentSecond)
                                            ctx.lineTo(curxx,hpergraph+starty-5);
									
                                        if(curxx>W-(2*GRAPHBORDERX))
                                            break;
																		
									
                                        sectodraw--;
                                        //									
                                        limit--;
                                        if(limit==0)
                                            break;
                                    }
                                }
                                else
                                {
                                    //								if(curtopicslist[y]=="ALC")								
                                    //									console.log('true');
                                }
                                sectodraw=curarray[i].CurrentSecond;
                                found=true;
                                curx=secondToX(curarray[i].CurrentSecond,W);
                                if(curx>W-(2*GRAPHBORDERX))
                                    break;
                                gy=(curarray[i].Topics[j].Count/max)*(hpergraph-10);
							
							
                                pointsx[curpoint]=curx;
                                pointsy[curpoint]=starty-5+(hpergraph-gy);
                                pointspointer[curpoint]=curarray[i].Topics[j];

                                globalpointsx[globalcurpoint]=curx;
                                globalpointsy[globalcurpoint]=starty-5+(hpergraph-gy);
                                globalpointspointer[globalcurpoint]=curarray[i].Topics[j];
							
                                prevx=curx;
                                //							if(curtopicslist[y]=="ALC")								
                                //								console.log(sectodraw+">"+pointsx[curpoint]+"->>"+pointsy[curpoint])
                                ctx.lineTo(pointsx[curpoint],pointsy[curpoint]);
							
                                //								console.log(pointsx[curpoint]+' '+pointsy[curpoint]);
												
                                globalcurpoint++;								
                                curpoint++;
                            }
                        }					
                    }
				
				
				
                    ctx.lineTo(pointsx[curpoint-1]+5,hpergraph+starty-5);
                    ctx.lineTo(W-(2*GRAPHBORDERX),hpergraph+starty-5);
                    ctx.closePath();
                    ctx.fillStyle='#00F';
                    ctx.strokeStyle='#888';
				
                    var mygradient=ctx.createLinearGradient(0,starty+5,0,starty+hpergraph-10);           
                    mygradient.addColorStop(0,"#F00");
                    mygradient.addColorStop(1,"#0F0");
                    ctx.fillStyle=mygradient;
				
                    ctx.fill();
                    ctx.stroke();
                    //				if(curtopicslist[y]=="ALC")		
                    //				console.log('stop');

                    i=0;

                    for (i = 0; i < curpoint; i++) {
                        server1 = false;
                        server2 = false;
                        for (z = 0; z < pointspointer[i].Messages.length; z++) {
                    
                            pubsubid = pointspointer[i].Messages[z].PubSubID;
                    
                            pubsubid=pubsubid.substring(pubsubid.length - 1);
                    
                            if (pubsubid == '1') {
                                server1 = true;
                            } else if (pubsubid == '2') 
                            {
                                server2 = true;
                            }
                            //console.log(">"+pointspointer[i].Topic+"<"+pubsubid+":"+pointspointer[i].Messages[z].PubSubID+">"+server1+"="+server2+"<");
                        }
			    
                        ctx.beginPath();
                        drawhalf=false;
                        
                        if ((server2 == true) && (server1 == false)) 
                        {
                            ctx.arc(pointsx[i], pointsy[i], 4, 0, Math.PI * 2, true);
                            ctx.fillStyle = '#F00';
                        }
                        else if ((server2 == false) && (server1 == true)) 
                        {
                            ctx.arc(pointsx[i], pointsy[i], 4, 0, Math.PI * 2, true);
                            ctx.fillStyle = '#0F0';
                        }
                        else {
                            ctx.arc(pointsx[i], pointsy[i], 4, 0, Math.PI*2, true);
                            ctx.fillStyle = '#F00';
                            drawhalf=true;
                        }
                        ctx.strokeStyle='#000';
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                        if(drawhalf)
                        {
                            ctx.beginPath();
                            ctx.arc(pointsx[i], pointsy[i], 4, Math.PI/2, Math.PI*3/2, true);
                            ctx.fillStyle = '#0F0';
                            ctx.strokeStyle='#000';
                            ctx.closePath();
                            ctx.fill();
                            ctx.stroke();
                        }
                    }
				
                    ctx.textAlign = "center";
                    ctx.fillStyle = "#000"; //white
                    ctx.fillText(max, 15, starty+20 );
				
				
                    ctx.textAlign = "center";
                    ctx.fillStyle = "#000"; //white
                    ctx.fillText(curtopicslist[y], (W/2), starty+20 );
				
                }	
            }
		
            function secondToX(curs,width)
            {
                if(curarray.length<2)
                    return 0;
                startsec=curarray[0].CurrentSecond;
                //			console.log((cursecond-startsec)+"/"+curs);
                //return ((width-2*GRAPHBORDERX)*((curs-startsec)/(cursecond-startsec)))+GRAPHBORDERX;
                return GRAPHBORDERX+((cursecond-curs)*5);
            }
		
            function fillRect(ctx,x,y,w,h,color) 
            {
                ctx.beginPath();
                ctx.rect(x,y,w,h);
                ctx.closePath();
                ctx.fillStyle=color;
                ctx.fill();
            }
		
            function paintRect(ctx,x,y,w,h,color) 
            {
                ctx.beginPath();
                ctx.rect(x,y,w,h);
                ctx.closePath();
                ctx.strokeStyle=color;
                ctx.stroke();
            }
		
        </script>
    </head>
    <body>
        <h1>APSB Supervisor</h1>
        <div id="topics" style='position:absolute;top:10px;right:10px;font-size:10px;'>
        </div>

        <div id="longmessage" style='position:absolute;top:50px;right:50px;left:50px;bottom:50px;font-size:10px;background-color:White;border:1px solid #000;z-index:50;'>
            <div id="longmessage2" style='position:absolute;top:10px;right:10px;left:10px;bottom:40px;font-size:10px;background-color:White;border:1px solid #000;overflow:auto;font-size:14px;'>
                <div id="longmessagecontent" ></div>
            </div>
            <div style='position:absolute;width:100%;bottom:10px;text-align:center;'><input type="button" onclick="$('#longmessage').hide();" value="Close" /></div>
        </div>


        <div id="records">
        </div>
        <div id="temp">
        </div>	
        <div id="messagescontainer" style="font-size:13px;position:absolute;width:40%;right:10px;top:10px;bottom:10px;overflow-x:hidden;overflow-y:auto;z-index:10;">
            <div id="messages" style="font-size:13px;position:absolute;z-index:10;top:3px;right:3px;left:3px;border:solid 1px #000;color:#fff;padding:0px;opacity: 0.8;background-color:#000;">		        
            </div>	
        </div>

        <div id="par" style='position:absolute;bottom:0px;left:0px;top:0px;right:0px;'>
            <canvas id="curvescanvas" width="300" height="300" style="position:absolute;bottom:0px;left:0px;top:50px;"></canvas>
        </div>
    </body>

</html>
